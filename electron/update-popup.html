<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>DFlash Console update</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121a24;
      --border: #223042;
      --text: #e8eef6;
      --muted: #8aa2c0;
      --accent: #2dd4bf;
      --accent-hover: #2ee6cf;
      --accent-text: #06231f;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; scrollbar-width: none; -ms-overflow-style: none; }
    /* This dialog never shows scrollbars. If one is ever forced, keep it dark. */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #0b0f14; }
    ::-webkit-scrollbar-thumb { background: #2a3a52; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #33465f; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      user-select: none;
      -webkit-user-select: none;
    }
    .card {
      width: 100%;
      background: linear-gradient(180deg, #101a26 0%, #0b1017 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      letter-spacing: 0.4px;
      font-size: 13px;
      color: var(--accent);
      text-transform: uppercase;
    }
    h1 {
      margin-top: 14px;
      font-size: 19px;
      line-height: 1.3;
      font-weight: 600;
    }
    .msg { margin-top: 8px; color: var(--text); font-size: 14px; line-height: 1.5; }
    .notes {
      margin-top: 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      max-height: 150px;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      user-select: text;
      -webkit-user-select: text;
    }
    .notes::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .progress-wrap { display: none; margin-top: 14px; }
    .progress-wrap.visible { display: block; }
    .progress-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.2s ease;
    }
    .progress-label { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .actions { margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end; }
    button {
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1a2432;
      color: var(--text);
      cursor: pointer;
    }
    button:hover { background: #223044; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }
    button.primary:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.55; cursor: default; }
    .hint { margin-top: 12px; color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">⚡ DFlash Console</div>
    <h1 id="title">A new version is available</h1>
    <p class="msg" id="message">DFlash Console is ready to update.</p>
    <div class="notes" id="notes" hidden></div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">Downloading…</div>
    </div>
    <div class="actions">
      <button id="laterBtn">Later</button>
      <button id="installBtn" class="primary">Install now</button>
    </div>
    <p class="hint" id="hint">Choosing “Later” will remind you again the next time DFlash Console starts.</p>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const version = String(params.get('version') || '').trim();
      const notes = String(params.get('notes') || '').trim();
      const api = window.DFlashDesktop;

      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const notesEl = document.getElementById('notes');
      const progressWrap = document.getElementById('progressWrap');
      const progressFill = document.getElementById('progressFill');
      const progressLabel = document.getElementById('progressLabel');
      const installBtn = document.getElementById('installBtn');
      const laterBtn = document.getElementById('laterBtn');

      if (version) {
        title.textContent = 'DFlash Console ' + version + ' is available';
        message.textContent = 'A new version of DFlash Console is ready. Install it now, or choose Later to be reminded next time the app starts.';
      }
      if (notes) {
        notesEl.textContent = notes;
        notesEl.hidden = false;
      }

      function setProgress(percentage, label) {
        progressWrap.classList.add('visible');
        progressFill.style.width = Math.max(0, Math.min(100, percentage || 0)) + '%';
        if (label) progressLabel.textContent = label;
      }

      if (api && api.onUpdateStatus) {
        api.onUpdateStatus((status) => {
          if (!status) return;
          if (status.state === 'downloading') {
            const pct = Number(status.percentage || (
              status.totalBytes ? (Number(status.receivedBytes || 0) / Number(status.totalBytes)) * 100 : 0
            ));
            setProgress(pct, 'Downloading… ' + Math.round(Math.max(0, Math.min(100, pct))) + '%');
            installBtn.disabled = true;
            laterBtn.disabled = true;
          } else if (status.state === 'installing') {
            setProgress(100, 'Installing… DFlash Console will restart automatically.');
            installBtn.disabled = true;
            laterBtn.disabled = true;
          } else if (status.state === 'ready') {
            setProgress(100, 'Downloaded. Click Install now to finish.');
            installBtn.disabled = false;
            laterBtn.disabled = false;
          }
        });
      }

      installBtn.addEventListener('click', async () => {
        installBtn.disabled = true;
        laterBtn.disabled = true;
        try {
          if (api && api.installUpdateNow) {
            await api.installUpdateNow();
          } else {
            installBtn.textContent = 'Installing…';
          }
        } catch (err) {
          message.textContent = 'Install failed: ' + (err && err.message ? err.message : 'unknown error');
          installBtn.disabled = false;
          laterBtn.disabled = false;
        }
      });

      laterBtn.addEventListener('click', () => {
        try {
          if (api && api.deferUpdate) api.deferUpdate();
        } catch (_err) { /* best-effort */ }
      });
    })();
  </script>
</body>
</html>
