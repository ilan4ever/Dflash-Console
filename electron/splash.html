<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DFlash Console</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0f14;
        color: #d8e2ef;
        font: 600 16px/1.4 "Segoe UI", system-ui, sans-serif;

    <div class="wrap">
      <div class="title">DFlash Console</div>
