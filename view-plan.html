<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DFlash Console — Build Plan</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #161d26;
      --text: #dce7f3;
      --muted: #8ca2b8;
      --accent: #64b5f6;
      --border: #294055;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 20, 25, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(8px);
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    header span { color: var(--muted); font-size: 13px; }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 24px 80px;
    }
    #content h1 { font-size: 28px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    #content h2 { font-size: 20px; margin-top: 32px; color: var(--accent); }
    #content h3 { font-size: 16px; margin-top: 24px; }
    #content p, #content li { color: #c5d4e3; }
    #content a { color: var(--accent); }
    #content code {
      background: #1a2430;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.92em;
    }
    #content pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
    }
    #content pre code { background: none; padding: 0; }
    #content table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 14px;
    }
    #content th, #content td {
      border: 1px solid var(--border);
      padding: 10px 12px;
      text-align: left;
    }
    #content th { background: var(--surface); color: var(--accent); }
    #content tr:nth-child(even) td { background: rgba(22, 29, 38, 0.5); }
    #content hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
    #content input[type="checkbox"] { margin-right: 8px; accent-color: var(--accent); }
    #loading { color: var(--muted); padding: 40px 0; text-align: center; }
    #error { color: #ef9a9a; padding: 40px 0; display: none; }
  </style>
</head>
<body>
  <header>
    <h1>DFlash Console — Build Plan</h1>
    <span>DFLASH-CONSOLE-PLAN.md</span>
  </header>
  <main>
    <div id="loading">Loading plan…</div>
    <div id="error"></div>
    <article id="content"></article>
  </main>
  <script>
    marked.setOptions({ gfm: true, breaks: false });
    fetch('DFLASH-CONSOLE-PLAN.md')
      .then(r => { if (!r.ok) throw new Error('Could not load DFLASH-CONSOLE-PLAN.md'); return r.text(); })
      .then(md => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').innerHTML = marked.parse(md);
      })
      .catch(err => {
        document.getElementById('loading').style.display = 'none';
        const el = document.getElementById('error');
        el.style.display = 'block';
        el.textContent = err.message;
      });
  </script>
</body>
</html>
