name: Windows release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish Windows packages
    runs-on: windows-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install Electron dependencies
        run: npm ci

      - name: Set up Python for release preflight
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Verify tag and package versions
        shell: pwsh
        run: |
          $tagVersion = "${{ inputs.release_tag || github.ref_name }}".TrimStart('v')
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Git tag v$tagVersion does not match package.json version $packageVersion."
          }

      - name: Run release preflight
        shell: pwsh
        run: python scripts/release-preflight.py

      - name: Build NSIS installer and portable package
        run: npx electron-builder --win --publish never

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $files = @(
            "dist-electron/DFlash-Console-Setup-$version-x64.exe",
            "dist-electron/DFlash-Console-Setup-$version-x64.exe.blockmap",
            "dist-electron/DFlash-Console-Portable-$version-x64.exe",
            "dist-electron/latest.yml"
          )
          $missing = $files | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Missing release files: $($missing -join ', ')"
          }
          $hashes = $files | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($_))"
          }
          $hashes | Set-Content -Path "dist-electron/SHA256SUMS.txt" -Encoding ascii

      - name: Create GitHub release and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $assets = @(
            "dist-electron/DFlash-Console-Setup-$version-x64.exe",
            "dist-electron/DFlash-Console-Setup-$version-x64.exe.blockmap",
            "dist-electron/DFlash-Console-Portable-$version-x64.exe",
            "dist-electron/latest.yml",
            "dist-electron/SHA256SUMS.txt"
          )
          gh release create "v$version" $assets `
            --repo "${{ github.repository }}" `
            --title "DFlash Console v$version" `
            --generate-notes `
            --latest
