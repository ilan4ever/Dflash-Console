name: Windows release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish Windows packages
    runs-on: windows-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install Electron dependencies
        run: npm ci

      - name: Set up Python for release preflight
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Verify tag and package versions
        shell: pwsh
        run: |
          $tagVersion = "${{ inputs.release_tag || github.ref_name }}".TrimStart('v')
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Git tag v$tagVersion does not match package.json version $packageVersion."
          }

      - name: Run release preflight
        shell: pwsh
        run: python scripts/release-preflight.py

      - name: Stage Electron runtime
        shell: pwsh
        run: |
          npm run predist
          if (-not (Test-Path 'electron/runtime-staging/requirements.lock')) {
            throw 'Electron runtime staging is missing requirements.lock.'
          }

      - name: Prepare signed DFlash update configuration
        shell: pwsh
        env:
          DFLASH_UPDATE_TOKEN: ${{ secrets.DFLASH_UPDATE_TOKEN }}
          DFLASH_UPDATE_PRIVATE_KEY: ${{ secrets.DFLASH_UPDATE_PRIVATE_KEY }}
        run: |
          if (-not $env:DFLASH_UPDATE_TOKEN -or -not $env:DFLASH_UPDATE_PRIVATE_KEY) {
            throw "DFLASH_UPDATE_TOKEN and DFLASH_UPDATE_PRIVATE_KEY repository secrets are required."
          }
          $endpoint = @{
            manifestUrl = "https://onevoiceai.in/?dflash-console-update=latest"
            token = $env:DFLASH_UPDATE_TOKEN
          } | ConvertTo-Json
          $endpoint | Set-Content electron/resources/update-endpoint.json -Encoding UTF8
          $env:DFLASH_UPDATE_PRIVATE_KEY | Set-Content "$env:RUNNER_TEMP\dflash-update-private.pem" -Encoding UTF8

      - name: Verify update-feed publishing configuration
        shell: pwsh
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USERNAME: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_UPDATE_ROOT: ${{ secrets.HOSTINGER_UPDATE_ROOT }}
        run: |
          if (-not $env:HOSTINGER_SSH_HOST -or -not $env:HOSTINGER_SSH_USERNAME -or -not $env:HOSTINGER_SSH_PORT -or -not $env:HOSTINGER_SSH_PRIVATE_KEY -or -not $env:HOSTINGER_UPDATE_ROOT) {
            throw "Hostinger SSH repository secrets and HOSTINGER_UPDATE_ROOT are required to publish the automatic-update feed."
          }

      - name: Build portable package and branded installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          npx electron-builder --win portable --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Portable package build failed.' }
          .\scripts\build-fast-installer.ps1 -SkipStage
          if ($LASTEXITCODE -ne 0) { throw 'Branded installer build failed.' }
          if ($env:WINDOWS_CSC_LINK -and $env:WINDOWS_CSC_KEY_PASSWORD) {
            .\scripts\sign-windows-artifact.ps1 `
              -Artifact ("dist-electron/DFlash-Console-Setup-" + (node -p "require('./package.json').version") + "-x64.exe")
            if ($LASTEXITCODE -ne 0) { throw 'Windows artifact signing failed.' }
          } else {
            Write-Warning 'No Windows code-signing certificate configured; publishing unsigned open-source artifacts.'
          }

      - name: Verify release signatures when configured
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $artifacts = @(
            "dist-electron/DFlash-Console-Setup-$version-x64.exe",
            "dist-electron/DFlash-Console-Portable-$version-x64.exe"
          )
          if ($env:WINDOWS_CSC_LINK -and $env:WINDOWS_CSC_KEY_PASSWORD) {
            foreach ($artifact in $artifacts) {
              $signature = Get-AuthenticodeSignature $artifact
              if ($signature.Status -ne 'Valid') {
                throw "Release artifact is not validly signed: $artifact ($($signature.Status))"
              }
            }
          } else {
            foreach ($artifact in $artifacts) {
              $signature = Get-AuthenticodeSignature $artifact
              Write-Warning "Unsigned release artifact allowed by policy: $artifact ($($signature.Status))"
            }
          }

      - name: Generate Electron update metadata for branded installer
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $fileName = "DFlash-Console-Setup-$version-x64.exe"
          $filePath = "dist-electron/$fileName"
          $sha512 = [Security.Cryptography.SHA512]::Create()
          try {
            $digest = [Convert]::ToBase64String($sha512.ComputeHash([IO.File]::ReadAllBytes($filePath)))
          } finally {
            $sha512.Dispose()
          }
          $size = (Get-Item $filePath).Length
          $releaseDate = (Get-Date).ToUniversalTime().ToString('o')
          @"
          version: $version
          files:
            - url: $fileName
              sha512: $digest
              size: $size
          path: $fileName
          sha512: $digest
          releaseDate: '$releaseDate'
          "@ | Set-Content 'dist-electron/latest.yml' -Encoding UTF8

      - name: Sign DFlash update manifest
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          node tools/sign-update-manifest.js `
            --installer "dist-electron/DFlash-Console-Setup-$version-x64.exe" `
            --output "dist-electron/latest.json" `
            --version $version `
            --key "$env:RUNNER_TEMP\dflash-update-private.pem" `
            --download-url "https://onevoiceai.in/?dflash-console-update=download"
          $manifest = Get-Content "dist-electron/latest.json" -Raw | ConvertFrom-Json
          if ($manifest.appId -ne "com.dflash.console") { throw "Unexpected DFlash manifest appId." }

      - name: Publish signed DFlash update feed
        continue-on-error: true
        shell: pwsh
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USERNAME: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_UPDATE_ROOT: ${{ secrets.HOSTINGER_UPDATE_ROOT }}
          DFLASH_UPDATE_TOKEN: ${{ secrets.DFLASH_UPDATE_TOKEN }}
        run: |
          $key = "$env:RUNNER_TEMP\hostinger-dflash.key"
          $env:HOSTINGER_SSH_PRIVATE_KEY | Set-Content $key -Encoding ascii
          icacls $key /inheritance:r | Out-Null
          icacls $key /grant:r "$($env:USERNAME):(R)" | Out-Null
          $env:HOSTINGER_SSH_PRIVATE_KEY_PATH = $key
          $version = node -p "require('./package.json').version"
          .\scripts\publish-dflash-update.ps1 `
            -Installer "dist-electron/DFlash-Console-Setup-$version-x64.exe" `
            -Manifest "dist-electron/latest.json" `
            -Token $env:DFLASH_UPDATE_TOKEN

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $files = @(
            "dist-electron/DFlash-Console-Setup-$version-x64.exe",
            "dist-electron/DFlash-Console-Portable-$version-x64.exe",
            "dist-electron/latest.yml"
          )
          $missing = $files | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Missing release files: $($missing -join ', ')"
          }
          $hashes = $files | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($_))"
          }
          $hashes | Set-Content -Path "dist-electron/SHA256SUMS.txt" -Encoding ascii

      - name: Create GitHub release and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $assets = @(
            "dist-electron/DFlash-Console-Setup-$version-x64.exe",
            "dist-electron/DFlash-Console-Portable-$version-x64.exe",
            "dist-electron/latest.yml",
            "dist-electron/SHA256SUMS.txt"
          )
          gh release create "v$version" $assets `
            --repo "${{ github.repository }}" `
            --title "DFlash Console v$version" `
            --generate-notes `
            --latest
