name: Bug report
description: Report a reproducible problem in DFlash Console.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic excerpt (optional)
      description: Paste from About → Report a bug if you copied a diagnostic report. Remove paths you do not want to share.
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private model URLs, local logs, or other sensitive data.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.0.27"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Windows 11, Python 3.13, PowerShell 7"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest reliable sequence of steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
